<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-label="Dhruv Agarwal — DHRUV.OS software, AI, cloud and product engineering profile">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset="0.55" stop-color="#07111F"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="25%" cy="45%" r="55%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="90%" cy="10%" r="60%">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".16"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset=".5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94A3B8" stroke-opacity=".055"/>
    </pattern>
    <filter id="glowCyan">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope=".35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
      .muted{fill:#94A3B8}.text{fill:#F8FAFC}.cyan{fill:#22D3EE}.violet{fill:#A78BFA}
      .tiny{font-size:12px;letter-spacing:2px}.small{font-size:14px}.label{font-size:13px;letter-spacing:1.5px}
    </style>
  </defs>

  <rect x="0" y="0" width="1180" height="610" rx="24" fill="url(#bg)"/>
  <rect x="0" y="0" width="1180" height="610" rx="24" fill="url(#grid)"/>
  <rect x="0" y="0" width="1180" height="610" rx="24" fill="url(#cyanGlow)"/>
  <rect x="0" y="0" width="1180" height="610" rx="24" fill="url(#violetGlow)"/>
  <rect x="1" y="1" width="1178" height="608" rx="23" fill="none" stroke="#334155" stroke-opacity=".65"/>

  <!-- terminal chrome -->
  <rect x="28" y="24" width="1124" height="46" rx="12" fill="#0F172A" fill-opacity=".72" stroke="#334155" stroke-opacity=".65"/>
  <circle cx="52" cy="47" r="6" fill="#EF4444"/>
  <circle cx="72" cy="47" r="6" fill="#F59E0B"/>
  <circle cx="92" cy="47" r="6" fill="#22C55E"/>
  <text x="120" y="51" class="mono small muted">dhruv@dhrv-os:~</text>
  <text x="1050" y="51" class="mono tiny cyan">● ONLINE</text>

  <!-- left visual panel -->
  <rect x="28" y="88" width="400" height="494" rx="18" fill="#0F172A" fill-opacity=".38" stroke="#334155" stroke-opacity=".7"/>
  <text x="56" y="120" class="mono tiny cyan">VISUAL.MAP</text>
  <line x1="56" y1="135" x2="400" y2="135" stroke="url(#line)" stroke-width="1"/>

  <!-- abstract terminal portrait / identity glyph -->
  <g class="mono" text-anchor="middle" filter="url(#glowCyan)" opacity=".92">
    <text x="228" y="210" font-size="16" fill="#22D3EE">···:::::···</text>
    <text x="228" y="228" font-size="18" fill="#22D3EE">··::+***+::··</text>
    <text x="228" y="248" font-size="20" fill="#67E8F9">·:+*#%%%#*+:·</text>
    <text x="228" y="270" font-size="22" fill="#A5F3FC">:+*#%@@@%#*+:</text>
    <text x="228" y="292" font-size="22" fill="#67E8F9">+*#%@@@@@%#*+</text>
    <text x="228" y="314" font-size="20" fill="#22D3EE">:*#%@@@@@%#*:</text>
    <text x="228" y="334" font-size="18" fill="#22D3EE">·+*#%@@@%#*+·</text>
    <text x="228" y="354" font-size="18" fill="#0EA5E9">··:+*###*+:··</text>
    <text x="228" y="374" font-size="16" fill="#0EA5E9">···:+***+:···</text>
    <text x="228" y="394" font-size="15" fill="#0EA5E9">····:+++ :····</text>
  </g>

  <text x="228" y="438" text-anchor="middle" class="mono" font-size="22" letter-spacing="7" fill="#F8FAFC">D H R U V</text>
  <text x="228" y="464" text-anchor="middle" class="mono" font-size="12" letter-spacing="5" fill="#22D3EE">D I G I T A L  S Y S T E M</text>

  <rect x="56" y="498" width="344" height="52" rx="10" fill="#020617" fill-opacity=".55" stroke="#334155"/>
  <text x="72" y="520" class="mono small cyan">~/profile $</text>
  <text x="174" y="520" class="mono small text">build --ship</text>
  <text x="72" y="540" class="mono tiny muted">SYSTEMS / PRODUCTS / EXPERIENCES</text>

  <!-- right info panel -->
  <rect x="452" y="88" width="700" height="494" rx="18" fill="#0F172A" fill-opacity=".52" stroke="#334155" stroke-opacity=".7" filter="url(#shadow)"/>
  <text x="484" y="120" class="mono tiny cyan">SYSTEM.INFO</text>
  <line x1="484" y1="135" x2="1120" y2="135" stroke="url(#line)" stroke-width="1"/>

  <text x="484" y="184" class="mono" font-size="42" font-weight="700" fill="#F8FAFC">DHRUV AGARWAL</text>
  <text x="486" y="214" class="mono" font-size="17" fill="#22D3EE">CSE STUDENT · BUILDER · PRODUCT ENGINEERING</text>
  <text x="486" y="244" class="mono small muted">Software · AI / ML · Cloud · Mobile · Creative Technology</text>

  <!-- info rows -->
  <g class="mono">
    <text x="486" y="292" class="label muted">ROLE</text>
    <text x="650" y="292" class="small text">CSE STUDENT / BUILDER</text>

    <text x="486" y="326" class="label muted">FOCUS</text>
    <text x="650" y="326" class="small text">AI · CLOUD · SOFTWARE · PRODUCTS</text>

    <text x="486" y="360" class="label muted">STACK</text>
    <text x="650" y="360" class="small text">PYTHON · DART · TYPESCRIPT · FLUTTER · AWS</text>

    <text x="486" y="394" class="label muted">BUILDING</text>
    <text x="650" y="394" class="small text">INKLY · DHRUV.OS</text>
  </g>

  <!-- project chips -->
  <text x="486" y="438" class="mono tiny violet">SELECTED SYSTEMS</text>
  <g class="mono">
    <rect x="486" y="454" width="132" height="34" rx="9" fill="#22D3EE" fill-opacity=".08" stroke="#22D3EE" stroke-opacity=".5"/>
    <text x="552" y="476" text-anchor="middle" class="small cyan">DHRUV.OS</text>

    <rect x="628" y="454" width="92" height="34" rx="9" fill="#8B5CF6" fill-opacity=".08" stroke="#8B5CF6" stroke-opacity=".5"/>
    <text x="674" y="476" text-anchor="middle" class="small violet">INKLY</text>

    <rect x="730" y="454" width="140" height="34" rx="9" fill="#22D3EE" fill-opacity=".08" stroke="#22D3EE" stroke-opacity=".5"/>
    <text x="800" y="476" text-anchor="middle" class="small cyan">QA-SENTINEL</text>

    <rect x="880" y="454" width="118" height="34" rx="9" fill="#8B5CF6" fill-opacity=".08" stroke="#8B5CF6" stroke-opacity=".5"/>
    <text x="939" y="476" text-anchor="middle" class="small violet">DROPVOICE</text>
  </g>

  <text x="486" y="536" class="mono small muted">github.com/dhruvagarwal4543</text>
  <text x="1120" y="536" text-anchor="end" class="mono tiny cyan">BUILD → SHIP</text>

  <!-- subtle scanline -->
  <rect x="28" y="88" width="1124" height="2" fill="#22D3EE" opacity=".08">
    <animate attributeName="y" values="88;570;88" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>